<style>
  :root {
    --ac: var(--brand-600);        /* trust-blue accent, used sparingly */
    --ac-soft: var(--brand-50);
    --ac-border: var(--brand-200);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--foreground);
    background: var(--background);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }

  /* ---- screen transition ---- */
  @keyframes screenIn {
    from { transform: translateY(10px); }
    to   { transform: translateY(0); }
  }
  .screen { animation: screenIn .42s cubic-bezier(.2,.7,.2,1) both; }

  @keyframes fadeUp {
    from { transform: translateY(10px); }
    to   { transform: translateY(0); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes pulseDot {
    0%,100% { opacity: .35; transform: scale(.85); }
    50%     { opacity: 1; transform: scale(1); }
  }
  @keyframes drift {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }

  .lucide { display: inline-block; vertical-align: middle; flex: none; }

  /* page surface used behind hero / wizard */
  .surface {
    min-height: 100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(37,99,235,.05), rgba(37,99,235,0) 55%),
      var(--background);
  }

  /* thin top nav */
  .nav {
    height: 64px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: rgba(255,255,255,.8); backdrop-filter: blur(8px); z-index: 20;
  }
  .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -.02em; }
  .nav-link { color: var(--muted-foreground); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .15s ease; }
  .nav-link:hover { color: var(--foreground); }
  @media (max-width: 860px) {
    .nav-links { display: none !important; }
    .hero-grid { grid-template-columns: 1fr !important; gap: 48px !important; padding: 44px 24px 72px !important; }
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: var(--primary); color: var(--primary-foreground);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--neutral-200); border-radius: 6px; border: 3px solid var(--background); }
  ::-webkit-scrollbar-thumb:hover { background: var(--neutral-300); }

  input::placeholder, textarea::placeholder { color: var(--muted-foreground); }
  .hl-link { color: var(--ac); text-decoration: none; font-weight: 500; }

  /* editorial display serif used for page headlines */
  .editorial {
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-optical-sizing: auto;
    letter-spacing: -.3px;
  }
  .editorial .it { font-style: italic; font-weight: 400; }

  /* unify CTAs as pills across all pages (matches the hero) */
  .ds-btn:not(.ds-btn--link) { border-radius: var(--radius-full) !important; }

  /* avatar stack for social proof */
  .av-stack { display: inline-flex; align-items: center; }
  .av-stack .av {
    width: 30px; height: 30px; border-radius: 999px; border: 2px solid var(--background);
    display: grid; place-items: center; font-size: 11.5px; font-weight: 600;
    margin-left: -9px; box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .av-stack .av:first-child { margin-left: 0; }

  /* carousel dots */
  .dots { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .dots span { width: 6px; height: 6px; border-radius: 999px; background: var(--neutral-300); transition: all .2s ease; }
  .dots span.on { width: 22px; background: var(--neutral-500); }
</style>
